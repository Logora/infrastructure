# Values for the official Agent Canvas Helm chart (OpenHands).
#
# Agent Canvas is the self-hosted, single-tenant all-in-one OpenHands
# deployment: browser UI + agent-server + automations in one StatefulSet.
# Chart source: https://github.com/OpenHands/OpenHands (helm/agent-canvas)
# There is no published Helm repo — install by cloning the repo and using
# the local chart path (see README.md).
#
# This instance is exposed at agent.logora.com and protected in front
# by oauth2-proxy (GitHub org "Logora") — see ./oauth2-proxy/.

# ── Persistence ─────────────────────────────────────────────────────────────
# State (conversations, secrets, repos, generated files) lives on a block
# volume. Keep the drives network-attached so state survives node
# replacement. storageClassName must be a ReadWriteOnce-capable block
# StorageClass present in your cluster (update to match your provider).
persistence:
  enabled: true
  storageClassName: csi-cinder-high-speed
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  mounts:
    - mountPath: /home/openhands/.openhands
      subPath: openhands
    - mountPath: /home/openhands/workspace
      subPath: workspace

# ── Ingress ─────────────────────────────────────────────────────────────────
# TLS auto-provisioned by cert-manager (Let's Encrypt). Long WebSocket
# timeouts are required for streaming agent events. The auth annotations
# route every request through oauth2-proxy before reaching Agent Canvas.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/auth-cache-key: "$cookie__openhands_oauth"
    nginx.ingress.kubernetes.io/auth-cache-duration: "200 202 10m"
    nginx.ingress.kubernetes.io/auth-url: "http://openhands-oauth2-proxy.openhands.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://agent.logora.com/oauth2/start?rd=$escaped_request_uri"
  hosts:
    - host: agent.logora.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - agent.logora.com
      secretName: openhands-tls

# ── LLM configuration ────────────────────────────────────────────────────────
# The LLM is configured in the Agent Canvas UI (Settings → LLM), which stores
# it durably on the PVC (~/.openhands/settings.json). That file is the source
# of truth — a Secret/env seed only applies on first boot, never over it.
# A Secret (openhands-llm) can be used to seed an API key out of band — never commit secrets.
# Example (env-style, used only if you prefer not to configure in the UI):
#   config:
#     extraEnv:
#       - name: LLM_MODEL
#         value: "openrouter/anthropic/claude-opus-5"
#       - name: LLM_BASE_URL
#         value: "https://openrouter.ai/api/v1"
#       - name: LLM_API_KEY
#         valueFrom:
#           secretKeyRef:
#             name: openhands-llm
#             key: LLM_API_KEY

# ── Slack (Socket Mode stream) ────────────────────────────────────────────────
# The automation service holds an outbound Socket Mode connection to Slack and
# pushes app_mention events into event-triggered automations — the self-hosted
# equivalent of webhooks. Requires Agent Canvas >= 1.17.0
# (openhands-automation >= 1.10.0). Tokens live in the openhands-slack Secret
# (see README "Slack (Socket Mode)" section) — never commit them.
config:
  extraEnv:
    - name: AUTOMATION_SLACK_APPS
      valueFrom:
        secretKeyRef:
          name: openhands-slack
          key: AUTOMATION_SLACK_APPS
    # ── Agent-server local ───────────────────────────────────────────
    # AUTOMATION_AGENT_SERVER_URL n'est pas défini : l'entrypoint utilise
    # l'agent-server du pod (http://127.0.0.1:18000). Les runs d'automation
    # consomment donc les mêmes slots que les conversations de l'UI.
    # ── Callbacks automation ─────────────────────────────────────────
    # Le dispatcher construit les callback URLs depuis AUTOMATION_BASE_URL.
    # L'Ingress automation-callback-ingress.yaml expose /api/automation/*
    # sans oauth2-proxy ; l'auth est le Bearer AUTOMATION_LOCAL_API_KEY
    # (secret openhands-session-api), injecté dans les runs via
    # AUTOMATION_CALLBACK_API_KEY par le dispatcher.
    - name: AUTOMATION_BASE_URL
      value: "https://agent.logora.com"
    - name: AUTOMATION_LOCAL_API_KEY
      valueFrom:
        secretKeyRef:
          name: openhands-session-api
          key: sessionApiKey
    # ── Limites runtime ──────────────────────────────────────────────
    # 6 runs actifs max, partagés entre l'UI et les automations. Au-delà,
    # l'agent-server répond 429 (pas de file d'attente native).
    - name: OH_MAX_CONCURRENT_RUNS
      value: "6"
    # Le bouton VS Code de l'UI n'est pas utilisé : on n'embarque pas
    # OpenVSCode Server dans le pod.
    - name: OH_ENABLE_VSCODE
      value: "false"
    # ── Sobriété mémoire ─────────────────────────────────────────────
    # Le browser reste activé (les agents en ont besoin) et OH_PRELOAD_TOOLS
    # reste au défaut (true) pour éviter de payer l'import browser_use au
    # premier usage.
    # Éviction des conversations inactives après 5 min (défaut : 20 min).
    # La passe tourne toutes les 150 s ; une conversation running, avec un
    # websocket attaché ou un rerun en attente n'est jamais évincée. Elle se
    # réhydrate depuis le PVC à la prochaine utilisation.
    - name: OH_CONVERSATION_IDLE_TTL_SECONDS
      value: "300"
    # ── Télémétrie ───────────────────────────────────────────────────
    # L'image cuit VITE_POSTHOG_API_KEY : sans ces variables, l'entrypoint
    # dérive OH_TELEMETRY_EXPORTER=posthog. On coupe les trois couches
    # (agent-server, automation, frontend).
    - name: OH_TELEMETRY_EXPORTER
      value: "none"
    # L'image cuit VITE_POSTHOG_API_KEY. L'entrypoint le recopie dans
    # AUTOMATION_POSTHOG_API_KEY avant de consulter VITE_DO_NOT_TRACK : il
    # faut donc vider la source pour que le backend automation n'émette pas.
    # Le frontend est couvert par AGENT_CANVAS_DISABLE_TELEMETRY.
    - name: VITE_POSTHOG_API_KEY
      value: ""
    - name: DO_NOT_TRACK
      value: "1"
    - name: VITE_DO_NOT_TRACK
      value: "1"
    - name: AGENT_CANVAS_DISABLE_TELEMETRY
      value: "1"
    # ── Cycle de vie des workspaces automation ───────────────────────
    # Depuis 1.32.0 (automation >= 1.25.0), le watchdog supprime le workspace
    # d'un run dès qu'il devient terminal, SAUF si l'automation a
    # keep_alive=true. C'est le comportement voulu : les conversations
    # d'automation ne sont pas reprenables, seul leur texte est conservé par
    # l'automation `Nettoyage horaire conversations inactives`.
    # 600 = 10 min de grâce après completed_at. Le sweep périodique du
    # watchdog (toutes les 60 s, 50 runs par passe) supprime ensuite le
    # workspace d'un run terminal, y compris s'il est encore référencé par
    # une conversation : c'est volontaire, ces conversations ne sont pas
    # reprenables. La grâce laisse aux callbacks de fin de run le temps de
    # lire le workspace sans le conserver indéfiniment.
    # Le CronJob `openhands-cleanup` reste le filet de sécurité pour les
    # workspaces antérieurs à 1.32.0 et ceux dont la ligne automation_runs
    # n'est pas exploitable (statut non terminal, base inaccessible).
    # Ne pas passer keep_alive=true sur les automations.
    - name: AUTOMATION_WORKSPACE_RETENTION_SECONDS
      value: "600"
    # Aligne le nombre de runs récupérés par poll sur OH_MAX_CONCURRENT_RUNS
    # (6) : moins de tâches dispatchées qui repartent en 429.
    - name: AUTOMATION_DISPATCHER_BATCH_SIZE
      value: "6"

# ── Secrets explicites ────────────────────────────────────────────────────
# Session key historiquement auto-générée par l'entrypoint et persistée sur
# le PVC (STATE_DIR/api-key.txt). Externalisée ici en Secret pour la rendre
# stable et référençable : le chart la monte en OH_SESSION_API_KEYS_0, et
# l'entrypoint en dérive OPENHANDS_AUTOMATION_API_KEY + AUTOMATION_LOCAL_API_KEY
# (même clé unique pour tout le stack, cf. entrypoint.sh). Ne PAS y mettre une
# valeur différente de l'actuelle sans prévenir : la clé est stockée dans le
# localStorage des navigateurs (backend K8s).
secrets:
  sessionApiKey:
    existingSecret: openhands-session-api
    key: sessionApiKey

# ── Dedicated node ──────────────────────────────────────────────────────────
# OpenHands pins to a dedicated node so agent builds/executions cannot
# evict (or be evicted by) the other applications on the cluster. The node
# is labelled and tainted (openhands=true:NoSchedule). Keep the taint/label
# persistent via your provider's node-pool template where supported, or it
# must be reapplied after the node is replaced (see README).
nodeSelector:
  node-role.openhands.infra: "true"
tolerations:
  - key: openhands
    operator: Equal
    value: "true"
    effect: NoSchedule

# ── RBAC ────────────────────────────────────────────────────────────────────
# No in-cluster permissions for the agent by default. Enable scoped access
# only if the agent must deploy into the cluster itself.
rbac:
  enabled: false
  namespaces: []
  clusterAdmin: false

# ── Resources ───────────────────────────────────────────────────────────────
# Pod limits sized for the all-in-one server + in-pod code execution
# (shell commands, compiles, tests). Tune to observed usage with
# `kubectl top pods`.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
    ephemeral-storage: 2Gi
  limits:
    cpu: "4"
    # 16 Go de RAM sur le nœud, 14,1 Gi allocatable, ~3 Gi déjà consommés
    # hors pod. 12Gi laissait le pod mettre le nœud en pression ; 10Gi garde
    # ~1 Gi de marge tout en restant ~7x l'usage actuel.
    memory: 10Gi
    ephemeral-storage: 10Gi
