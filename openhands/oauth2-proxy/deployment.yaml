apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands-oauth2-proxy
  labels:
    app: openhands-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openhands-oauth2-proxy
  template:
    metadata:
      labels:
        app: openhands-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=github
            - --github-org=logora
            - --redirect-url=https://openhands.logora.fr/oauth2/callback
            - --cookie-secure=true
            - --cookie-name=_openhands_oauth
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --upstream=static://202
            - --whitelist-domain=openhands.logora.fr
            - --pass-access-token=false
            - --set-xauthrequest=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: openhands-github-oauth
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openhands-github-oauth
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: openhands-github-oauth
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              memory: "128Mi"
            requests:
              memory: "64Mi"
      nodeSelector:
        node-role.openhands.infra: "true"
      tolerations:
        - key: openhands
          operator: Equal
          value: "true"
          effect: NoSchedule
