apiVersion: v1
kind: ServiceAccount
metadata:
  name: openhands-cleanup
  namespace: openhands
  labels:
    app: openhands-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openhands-cleanup
  namespace: openhands
  labels:
    app: openhands-cleanup
rules:
  # Lister/résoudre le pod agent-canvas-0.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Lancer le nettoyage via `kubectl exec` dans le pod (aucun montage
  # concurrent du PVC — pas de risque de contention SQLite/ext4).
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openhands-cleanup
  namespace: openhands
  labels:
    app: openhands-cleanup
subjects:
  - kind: ServiceAccount
    name: openhands-cleanup
    namespace: openhands
roleRef:
  kind: Role
  name: openhands-cleanup
  apiGroup: rbac.authorization.k8s.io
