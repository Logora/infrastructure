# Nettoyage serveur des runs d'automation OpenHands.
#
# Pourquoi côté serveur et pas en automatisation LLM :
# - déterministe (ne dépend ni du modèle, ni du quota OpenRouter, ni d'une
#   conversation) et gratuit (aucun token consommé) ;
# - chaque run laisse un workdir complet (~550M, dizaines de milliers de
#   fichiers) dans ~/.openhands/workspaces/automation-runs → c'est ce qui
#   a déjà saturé les inodes du PVC (cf. README "Troubleshooting").
#
# Politique (corrigée 2026-10-14 après casse de 192 conversations) : un run
# n'est supprimé que s'il N'EST REFERENCE PAR AUCUNE conversation existante
# (working_dir dans meta.json) ET qu'il est inactif depuis 24h. L'ancien
# "garde les 5 plus récents" supprimait les workdirs de conversations
# vivantes -> FileNotFoundError en cascade à chaque reprise.
# Depuis Agent Canvas 1.32.0, le watchdog supprime le workspace dès la fin du
# run : ce CronJob ne traite plus que les résidus (runs non terminalisés,
# crashes) et les workspaces antérieurs à 1.32.0. La corrélation avec les
# conversations est conservée par prudence.
# Ne touche jamais à agent-canvas/conversations ni aux autres workspaces.
#
# Application : kubectl apply -f openhands/cleanup/
# Test manuel : kubectl create job --from=cronjob/openhands-cleanup \
#                 -n openhands openhands-cleanup-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openhands-cleanup
  namespace: openhands
  labels:
    app: openhands-cleanup
spec:
  # Toutes les heures — les runs s'accumulent vite (~35/h).
  schedule: "0 * * * *"
  # Suspendu le temps de valider la politique par corrélation (validée
  # 2026-10-14 : 0 suppression abusive sur 29 runs) -> réactivé.
  suspend: false
  # Interdit le chevauchement des exécutions.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # La purge initiale (des dizaines de runs × dizaines de milliers de
      # fichiers sur volume réseau) peut prendre plusieurs minutes.
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: openhands-cleanup
        spec:
          serviceAccountName: openhands-cleanup
          restartPolicy: OnFailure
          nodeSelector:
            node-role.openhands.infra: "true"
          tolerations:
            - key: openhands
              operator: Equal
              value: "true"
              effect: NoSchedule
          containers:
            - name: cleanup
              # alpine/k8s suit les versions de kubectl — épinglé sur la
              # version du serveur (v1.32.2). bitnami/kubectl ne publie
              # plus que `latest`, donc inutilisable ici.
              image: docker.io/alpine/k8s:1.32.2
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  kubectl -n openhands exec agent-canvas-0 -- sh -c \
                    'cd /home/openhands/.openhands/workspaces/automation-runs || { echo "no automation-runs dir, nothing to do"; exit 0; }; echo "runs before: $(ls | wc -l)"; df -i . | tail -1; grep -rhoE "\"working_dir\":\"[^\"]*automation-runs/[^\"]+\"" /home/openhands/.openhands/agent-canvas/conversations/*/meta.json 2>/dev/null | sed "s|.*/automation-runs/||; s|/.*||; s|\"||" | sort -u > /tmp/ref_runs.txt; echo "referenced runs: $(wc -l < /tmp/ref_runs.txt)"; for r in */; do r=${r%/}; case "$r" in *[^A-Za-z0-9_.-]*|"") continue;; esac; grep -qxF "$r" /tmp/ref_runs.txt && continue; if find "$r" -mmin -1440 -print -quit 2>/dev/null | grep -q .; then continue; fi; echo "DELETE: $r"; rm -rf -- "$r"; done; echo "runs after: $(ls | wc -l)"; df -i . | tail -1'
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
