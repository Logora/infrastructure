mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
  pullPolicy: IfNotPresent
  tag: "0.149.0"

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    kubeletstats:
      collection_interval: 15s
      auth_type: "serviceAccount"
      endpoint: "https://${K8S_NODE_IP}:10250"
      insecure_skip_verify: true
      metric_groups:
        - pod
        - node
        - container
    filelog:
      include:
        - /var/log/pods/*/*/*.log
      exclude:
        - /var/log/pods/monitoring_*/*/*.log
        - /var/log/pods/kube-system_*/*/*.log
        - /var/log/pods/kube-public_*/*/*.log
        - /var/log/pods/kubernetes-dashboard_*/*/*.log
        - /var/log/pods/ingress-nginx_*/*/*.log
        - /var/log/pods/cert-manager_*/*/*.log
        - /var/log/pods/metabase_*/*/*.log
      start_at: beginning
      include_file_path: true
      operators:
        - type: container
          format: containerd
          on_error: send
        - type: json_parser
          parse_from: body
          on_error: send
          timestamp:
            parse_from: attributes.time
            layout_type: strptime
            layout: '%Y-%m-%dT%H:%M:%S.%fZ'

  processors:
    filter/drop_k8s_namespaces:
      metrics:
        exclude:
          match_type: regexp
          resource_attributes:
            - key: k8s.namespace.name
              value: (kube-system|kube-public|cert-manager)
    cumulativetodelta: {}
    batch:
      send_batch_max_size: 10000
      timeout: 10s
    resourcedetection:
      detectors: [env, system]
    k8sattributes:
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.container.name
          - k8s.deployment.name
          - k8s.node.name
          - container.image.name
          - container.image.tag
      pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
    resource/set_service_name:
      attributes:
        - key: service.name
          from_attribute: k8s.container.name
          action: upsert
    tail_sampling:
      decision_wait: 20s
      policies:
        - name: "errors"
          type: status_code
          status_code:
            status_codes: [ERROR]
        - name: "probabilistic"
          type: probabilistic
          probabilistic:
            sampling_percentage: 10

  exporters:
    debug:
      verbosity: detailed
    otlp/uptrace:
      endpoint: https://otlp.uptrace.dev:4317
      tls: { insecure: false }
      headers:
        uptrace-dsn: ${UPTRACE_DSN}

  service:
    pipelines:
      metrics:
        receivers: [kubeletstats]
        processors: [filter/drop_k8s_namespaces, cumulativetodelta, batch, resourcedetection]
        exporters: [otlp/uptrace]
      logs:
        receivers: [filelog]
        processors: [k8sattributes, resource/set_service_name, batch, resourcedetection]
        exporters: [otlp/uptrace]
      traces:
        receivers: [otlp]
        processors: [k8sattributes, resourcedetection, tail_sampling, batch]
        exporters: [otlp/uptrace]

resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 500m
    memory: 128Mi

clusterRole:
  create: true
  rules:
    - apiGroups: ["apps"]
      resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["extensions"]
      resources: ["daemonsets", "deployments", "replicasets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]

serviceAccount:
  create: true
  name: otel-collector

extraEnvs:
  - name: UPTRACE_DSN
    valueFrom:
      secretKeyRef:
        name: otel-collector-secrets
        key: UPTRACE_DSN
  - name: MEILISEARCH_PROD_METRICS_KEY
    valueFrom:
      secretKeyRef:
        name: otel-collector-secrets
        key: MEILISEARCH_PROD_METRICS_KEY
  - name: MEILISEARCH_STAGING_METRICS_KEY
    valueFrom:
      secretKeyRef:
        name: otel-collector-secrets
        key: MEILISEARCH_STAGING_METRICS_KEY

service:
  enabled: true
  type: ClusterIP